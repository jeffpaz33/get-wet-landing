  <script>
    const { createClient } = supabase;
    const db = createClient(
      'https://zescfvaufdtktbxyyhxd.supabase.co',

    );

    // Video autoplay
    const video = document.getElementById('hero-video');
    video.setAttribute('muted', '');
    video.defaultMuted = true;
    video.muted = true;
    const tryPlay = () => video.play().catch(() => {});
    if (video.readyState >= 3) tryPlay();
    else video.addEventListener('canplay', tryPlay, { once: true });
    document.addEventListener('touchstart', () => tryPlay(), { once: true });

    // Mute toggle
    function toggleMute() {
      video.muted = !video.muted;
      document.getElementById('mute-btn').textContent = video.muted ? 'UNMUTE' : 'MUTE';
    }

    // Expand/collapse
    let expanded = false;
    function toggleExpand() {
      expanded = !expanded;
      document.getElementById('details-panel').classList.toggle('open', expanded);
      const chevron = document.getElementById('chevron-btn');
      chevron.style.transform = expanded ? 'rotate(180deg)' : 'rotate(0deg)';
    }

    // Scroll → on-white
    window.addEventListener('scroll', () => {
      document.body.classList.toggle('on-white', window.scrollY > 150);
    }, { passive: true });

    // Email submit
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const input = document.getElementById('email-input');
      const email = input.value.trim();
      btn.disabled = true;
      btn.textContent = 'Sending…';
      const { error } = await db.from('subscribers').insert({ email });
      if (error && error.code !== '23505') {
        btn.textContent = 'Try again';
        btn.disabled = false;
      } else {
        btn.textContent = "You're in!";
        btn.style.background = '#40E0D0';
        btn.style.color = '#fff';
        input.value = '';
      }
    }
  </script>
